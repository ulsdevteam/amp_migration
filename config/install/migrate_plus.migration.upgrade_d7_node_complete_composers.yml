langcode: en
status: true
dependencies: {  }
id: upgrade_d7_node_complete_composers
class: Drupal\node\Plugin\migrate\D7NodeTranslation
field_plugin_method: null
cck_plugin_method: null
migration_tags:
  - 'Drupal 7'
  - Content
migration_group: migrate_drupal_7
label: 'Node complete (Composers)'
source:
  plugin: d7_node_complete
  node_type: composers
process:
  langcode:
    -
      plugin: str_replace
      case_insensitive: false
      source: language
      search: und
      replace: en
  title:
    -
      plugin: get
      source: title
  uid:
    -
      plugin: get
      source: node_uid
  status:
    -
      plugin: get
      source: status
  created:
    -
      plugin: get
      source: created
  changed:
    -
      plugin: get
      source: timestamp
  promote:
    -
      plugin: get
      source: promote
  sticky:
    -
      plugin: get
      source: sticky
  revision_uid:
    -
      plugin: get
      source: revision_uid
  revision_log:
    -
      plugin: get
      source: log
  revision_timestamp:
    -
      plugin: get
      source: timestamp
  content_translation_source:
    -
      plugin: get
      source: source_langcode
  comment_node_composers/0/status:
    -
      plugin: get
      source: comment
  body:
    -
      plugin: get
      source: body
  field_biography_composers:
    -
      plugin: get
      source: field_biography_composers
  field_performers:
    -
      plugin: get
      source: field_performers
    -
      plugin: callback
      callable: var_dump
      source: field_performers
  field_date_of_birth:
    -
      plugin: get
      source: field_date_of_birth
  field_date_of_death:
    -
      plugin: get
      source: field_date_of_death
  field_image:
    -
      plugin: sub_process
      source: field_image
      process:
        target_id: fid
        alt: alt
        title: title
        width: width
        height: height
  field_publishers:
    -
      plugin: sub_process
      source: field_publishers
      process:
        target_id:
          -
            plugin: skip_on_empty
            method: process
            source: tid
          -
            plugin: migration_lookup
            migration: upgrade_d7_taxonomy_term_publishers
            source: tid
  field_related_exhibits:
    -
      plugin: sub_process
      source: field_related_exhibits
      process:
        target_id:
          -
            plugin: skip_on_empty
            method: process
            source: target_id
          -
            plugin: node_complete_lookup
            migration_map_table: migrate_map_upgrade_d7_node_complete_exhibits
            source: target_id
  field_related_genre:
    -
      plugin: sub_process
      source: field_related_genre
      process:
        target_id:
          -
            plugin: skip_on_empty
            method: process
            source: tid
          -
            plugin: migration_lookup
            migration: upgrade_d7_taxonomy_term_genres
            source: tid
  field_related_cam_collections:
    -
      plugin: sub_process
      source: field_related_cam_collections
      process:
        target_id:
          -
            plugin: skip_on_empty
            method: process
            source: target_id
          -
            plugin: node_complete_lookup
            migration_map_table: migrate_map_upgrade_d7_node_complete_amp_collection
            source: target_id
  field_image_copyright:
    -
      plugin: get
      source: field_image_copyright
  field_image_attribution:
    -
      plugin: get
      source: field_image_attribution
  field_related_resources:
    -
      plugin: sub_process
      source: field_related_resources
      process:
        target_id:
          -
            plugin: skip_on_empty
            method: process
            source: pid
          -
            plugin: entity_lookup
            source: pid
            entity_type: node
            bundle_key: type
            bundle: islandora_object
            value_key: field_pid
            ignore_case: true
            access_check: false
  field_artist_type:
    -
      plugin: get
      source: field_artist_type
  field_date_of_birth_circa:
    -
      plugin: get
      source: field_date_of_birth_circa
  field_date_of_death_circa:
    -
      plugin: get
      source: field_date_of_death_circa
  field_date_of_birth_sort:
    -
      plugin: sub_process
      source: field_date_of_birth_sort
      process:
        value:
          plugin: format_date
          from_format: 'Y-m-d H:i:s'
          to_format: Y-m-d
          source: value
  field_date_of_death_sort:
    -
      plugin: sub_process
      source: field_date_of_death_sort
      process:
        value:
          plugin: format_date
          from_format: 'Y-m-d H:i:s'
          to_format: Y-m-d
          source: value
destination:
  plugin: 'entity_complete:node'
  translations: true
  default_bundle: composers
idMap: {  }
migration_dependencies:
  required:
    - upgrade_d7_node_type
  optional:
    - upgrade_d7_field_instance
include: null
