langcode: en
status: true
dependencies: {  }
id: upgrade_d7_node_complete_songs
class: Drupal\node\Plugin\migrate\D7NodeTranslation
field_plugin_method: null
cck_plugin_method: null
migration_tags:
  - 'Drupal 7'
  - Content
migration_group: migrate_drupal_7
label: 'Node complete (Songs)'
source:
  plugin: d7_node_complete
  node_type: songs
process:
  langcode:
    -
      plugin: str_replace
      case_insensitive: false
      source: language
      search: und
      replace: en
  title:
    -
      plugin: get
      source: title
  uid:
    -
      plugin: get
      source: node_uid
  status:
    -
      plugin: get
      source: status
  created:
    -
      plugin: get
      source: created
  changed:
    -
      plugin: get
      source: timestamp
  promote:
    -
      plugin: get
      source: promote
  sticky:
    -
      plugin: get
      source: sticky
  revision_uid:
    -
      plugin: get
      source: revision_uid
  revision_log:
    -
      plugin: get
      source: log
  revision_timestamp:
    -
      plugin: get
      source: timestamp
  content_translation_source:
    -
      plugin: get
      source: source_langcode
  body/value:
    -
      plugin: get
      source: body/0/value
  body/summary:
    -
      plugin: get
      source: body/0/summary
  body/format:
    -
      plugin: default_value
      default_value: full_html
  field_alternate_title:
    -
      plugin: get
      source: field_alternate_title
  field_year_of_publication:
    -
      plugin: get
      source: field_year_of_publication
  field_manuscript:
    -
      plugin: sub_process
      source: field_manuscript
      process:
        target_id:
          -
            plugin: skip_on_empty
            method: process
            source: pid
          -
            plugin: entity_lookup
            source: pid
            entity_type: node
            bundle_key: type
            bundle: islandora_object
            value_key: field_pid
            ignore_case: true
            access_check: false
  field_published_score:
    -
      plugin: sub_process
      source: field_published_score
      process:
        target_id:
          -
            plugin: skip_on_empty
            method: process
            source: pid
          -
            plugin: entity_lookup
            source: pid
            entity_type: node
            bundle_key: type
            bundle: islandora_object
            value_key: field_pid
            ignore_case: true
            access_check: false
  field_songbook:
    -
      plugin: sub_process
      source: field_songbook
      process:
        target_id:
          -
            plugin: skip_on_empty
            method: process
            source: pid
          -
            plugin: entity_lookup
            source: pid
            entity_type: node
            bundle_key: type
            bundle: islandora_object
            value_key: field_pid
            ignore_case: true
            access_check: false
  field_correspondence:
    -
      plugin: sub_process
      source: field_correspondence
      process:
        target_id:
          -
            plugin: skip_on_empty
            method: process
            source: pid
          -
            plugin: entity_lookup
            source: pid
            entity_type: node
            bundle_key: type
            bundle: islandora_object
            value_key: field_pid
            ignore_case: true
            access_check: false
  field_business_records:
    -
      plugin: sub_process
      source: field_business_records
      process:
        target_id:
          -
            plugin: skip_on_empty
            method: process
            source: pid
          -
            plugin: entity_lookup
            source: pid
            entity_type: node
            bundle_key: type
            bundle: islandora_object
            value_key: field_pid
            ignore_case: true
            access_check: false
  field_recording_songs:
    -
      plugin: sub_process
      source: field_recording_songs
      process:
        target_id:
          -
            plugin: skip_on_empty
            method: process
            source: pid
          -
            plugin: entity_lookup
            source: pid
            entity_type: node
            bundle_key: type
            bundle: islandora_object
            value_key: field_pid
            ignore_case: true
            access_check: false
  field_related_genre:
    -
      plugin: sub_process
      source: field_related_genre
      process:
        target_id:
          -
            plugin: skip_on_empty
            method: process
            source: tid
          -
            plugin: migration_lookup
            migration: upgrade_d7_taxonomy_term_genres
            source: tid
  field_composed_by:
    -
      plugin: sub_process
      source: field_composed_by
      process:
        target_id:
          -
            plugin: skip_on_empty
            method: process
            source: target_id
          -
            plugin: node_complete_lookup
            migration_map_table: migrate_map_upgrade_d7_node_complete_composers
            source: target_id
  field_related_cam_collections:
    -
      plugin: sub_process
      source: field_related_cam_collections
      process:
        target_id:
          -
            plugin: skip_on_empty
            method: process
            source: target_id
          -
            plugin: node_complete_lookup
            migration_map_table: migrate_map_upgrade_d7_node_complete_amp_collection
            source: target_id
  field_image:
    -
      plugin: sub_process
      source: field_image
      process:
        target_id: fid
        alt:
          -
            plugin: get
            source: alt
          -
            plugin: default_value
            default_value: Image
        title: title
        width: width
        height: height
  field_image_attribution:
    -
      plugin: get
      source: field_image_attribution
  field_image_copyright:
    -
      plugin: get
      source: field_image_copyright
  field_contributors:
    -
      plugin: get
      source: field_contributors
  field_sort_title:
    -
      plugin: get
      source: field_sort_title
  field_year_of_publication_circa:
    -
      plugin: get
      source: field_year_of_publication_circa
  field_publication_date:
    -
      plugin: get
      source: field_publication_date
  field_lyricist:
    -
      plugin: get
      source: field_lyricist
  field_publication_date_sort:
    -
      plugin: sub_process
      source: field_publication_date_sort
      process:
        value:
          plugin: format_date
          from_format: 'Y-m-d H:i:s'
          to_format: Y-m-d
          source: value
destination:
  plugin: 'entity_complete:node'
  translations: true
  default_bundle: songs
idMap: {  }
migration_dependencies:
  required:
    - upgrade_d7_node_type
  optional:
    - upgrade_d7_field_instance
include: null
