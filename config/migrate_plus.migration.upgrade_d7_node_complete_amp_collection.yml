langcode: en
status: true
dependencies: {  }
id: upgrade_d7_node_complete_amp_collection
class: Drupal\node\Plugin\migrate\D7NodeTranslation
field_plugin_method: null
cck_plugin_method: null
migration_tags:
  - 'Drupal 7'
  - Content
migration_group: migrate_drupal_7
label: 'Node complete (AMP Collection)'
source:
  plugin: d7_node_complete
  node_type: amp_collection
process:
  langcode:
    -
      plugin: str_replace
      case_insensitive: false
      source: language
      search: und
      replace: en
  title:
    -
      plugin: get
      source: title
  uid:
    -
      plugin: get
      source: node_uid
  status:
    -
      plugin: get
      source: status
  created:
    -
      plugin: get
      source: created
  changed:
    -
      plugin: get
      source: timestamp
  promote:
    -
      plugin: get
      source: promote
  sticky:
    -
      plugin: get
      source: sticky
  revision_uid:
    -
      plugin: get
      source: revision_uid
  revision_log:
    -
      plugin: get
      source: log
  revision_timestamp:
    -
      plugin: get
      source: timestamp
  content_translation_source:
    -
      plugin: get
      source: source_langcode
  body:
    -
      plugin: get
      source: body
  field_related_collections:
    -
      plugin: sub_process
      source: field_related_collections
      process:
        target_id:
          -
            plugin: skip_on_empty
            method: process
            source: pid
          -
            plugin: entity_lookup
            source: pid
            entity_type: node
            bundle_key: type
            bundle: islandora_object
            value_key: field_local_identifier
            ignore_case: true
            access_check: false
  field_related_genre:
    -
      plugin: sub_process
      source: field_related_genre
      process:
        target_id: tid
  field_finding_aids:
    -
      plugin: sub_process
      source: field_finding_aids
      process:
        target_id:
          -
            plugin: skip_on_empty
            method: process
            source: pid
          -
            plugin: entity_lookup
            source: pid
            entity_type: node
            bundle_key: type
            bundle: islandora_object
            value_key: field_pid
            ignore_case: true
            access_check: false
  check-findingaid:
    -
      plugin: callback
      callable: var_dump
      source: field_finding_aids
  field_image:
    -
      plugin: sub_process
      source: field_image
      process:
        target_id: fid
        alt: alt
        title: title
        width: width
        height: height
  field_image_copyright:
    -
      plugin: get
      source: field_image_copyright
  field_image_attribution:
    -
      plugin: get
      source: field_image_attribution
destination:
  plugin: 'entity_complete:node'
  translations: true
  default_bundle: amp_collection
idMap: {  }
migration_dependencies:
  required:
    - upgrade_d7_node_type
  optional:
    - upgrade_d7_field_instance
include: null
